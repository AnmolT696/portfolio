<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f0f0f;
    --paper: #f4f1ec;
    --warm: #e8e3d9;
    --accent: #b5813a;
    --accent-light: #d4a55a;
    --mid: #7a7670;
    --border: #d6d0c6;
    --dark: #1a1814;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    cursor: none;
    overflow-x: hidden;
  }

  /* Cursor */
  #cursor {
    position: fixed; width: 6px; height: 6px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, background 0.2s;
  }
  #cursor.big { width: 36px; height: 36px; background: transparent; border: 1px solid var(--accent); }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 52px;
    background: rgba(244,241,236,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s;
  }
  nav.scrolled { border-color: var(--border); }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; font-weight: 300; letter-spacing: 0.14em;
    text-transform: uppercase; text-decoration: none; color: var(--ink);
  }
  .nav-logo span { color: var(--accent); font-style: italic; }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a {
    text-decoration: none; color: var(--mid);
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-badge {
    font-size: 9px; letter-spacing: 0.14em; color: var(--accent);
    border: 1px solid var(--accent); padding: 4px 10px; text-transform: uppercase;
  }

  /* HERO */
  #hero {
    min-height: 100vh; display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .hero-left {
    padding: 140px 52px 72px;
    display: flex; flex-direction: column; justify-content: flex-end;
    position: relative;
    border-right: 1px solid var(--border);
  }
  .hero-left::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(15,15,15,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,15,15,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .hero-eyebrow {
    font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .hero-eyebrow::before { content: ''; display: block; width: 28px; height: 1px; background: var(--accent); }
  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 7vw, 96px);
    font-weight: 300; line-height: 0.88;
    letter-spacing: -0.02em; margin-bottom: 36px;
  }
  .hero-name em { font-style: italic; color: var(--accent); display: block; }
  .hero-desc {
    font-size: 11.5px; color: #555; line-height: 2;
    max-width: 380px; margin-bottom: 44px;
    padding-left: 16px; border-left: 2px solid var(--accent);
  }
  .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 12px 28px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    text-decoration: none; transition: all 0.25s; border: none; cursor: none;
  }
  .btn-solid { background: var(--ink); color: var(--paper); }
  .btn-solid:hover { background: var(--accent); }
  .btn-outline { border: 1px solid var(--ink); color: var(--ink); background: transparent; }
  .btn-outline:hover { background: var(--ink); color: var(--paper); }

  .hero-right {
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 140px 52px 72px;
    background: var(--dark);
    position: relative; overflow: hidden;
  }
  .hero-right::before {
    content: 'STRUCTURAL\AENGINEERING';
    position: absolute; top: 60px; right: -20px;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(80px, 10vw, 140px);
    font-weight: 300; color: rgba(255,255,255,0.04);
    line-height: 0.9; white-space: pre; text-align: right;
    letter-spacing: -0.04em;
    pointer-events: none;
  }
  .credentials-list { display: flex; flex-direction: column; gap: 0; }
  .cred-item {
    display: flex; align-items: flex-start; gap: 20px;
    padding: 22px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .cred-item:first-child { border-top: 1px solid rgba(255,255,255,0.07); }
  .cred-num { font-size: 9px; color: var(--accent); letter-spacing: 0.14em; min-width: 24px; }
  .cred-title { font-size: 11px; color: rgba(255,255,255,0.85); letter-spacing: 0.06em; }
  .cred-sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; }
  .hero-award {
    margin-top: 40px; padding: 20px 24px;
    border: 1px solid rgba(181,129,58,0.35);
    background: rgba(181,129,58,0.07);
  }
  .award-label { font-size: 9px; letter-spacing: 0.22em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .award-text { font-size: 11px; color: rgba(255,255,255,0.7); line-height: 1.7; }

  /* STATS */
  .stats-bar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 32px 40px; border-right: 1px solid var(--border);
    transition: background 0.25s;
  }
  .stat:last-child { border-right: none; }
  .stat:hover { background: var(--warm); }
  .stat-n {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px; font-weight: 300; line-height: 1; color: var(--ink);
  }
  .stat-l { font-size: 9.5px; letter-spacing: 0.16em; color: var(--mid); text-transform: uppercase; margin-top: 4px; }

  /* SECTION WRAPPER */
  section { padding: 88px 52px; }
  .sec-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 56px;
  }
  .sec-n { font-size: 9px; letter-spacing: 0.22em; color: var(--accent); }
  .sec-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px; font-weight: 300; letter-spacing: -0.01em;
  }
  .sec-rule { flex: 1; height: 1px; background: var(--border); }

  /* PROJECTS */
  #projects { border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .projects-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
  }
  .proj {
    background: var(--paper); padding: 36px 32px 44px;
    position: relative; overflow: hidden;
    transition: background 0.3s;
  }
  .proj:hover { background: var(--dark); }
  .proj-sector {
    display: inline-block;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px;
  }
  .proj-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 400; line-height: 1.2;
    margin-bottom: 12px; transition: color 0.3s;
  }
  .proj:hover .proj-name { color: #fff; }
  .proj-meta {
    font-size: 10px; color: var(--mid);
    margin-bottom: 12px; letter-spacing: 0.08em;
    transition: color 0.3s;
  }
  .proj:hover .proj-meta { color: rgba(255,255,255,0.4); }
  .proj-desc {
    font-size: 11px; color: #555; line-height: 1.85;
    transition: color 0.3s;
  }
  .proj:hover .proj-desc { color: rgba(255,255,255,0.62); }
  .proj-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .ptag {
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid var(--border); padding: 3px 9px; color: var(--mid);
    transition: border-color 0.3s, color 0.3s;
  }
  .proj:hover .ptag { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.4); }
  .proj-arrow {
    position: absolute; bottom: 24px; right: 24px;
    font-size: 16px; color: var(--accent); opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .proj:hover .proj-arrow { opacity: 1; transform: none; }
  .proj-value {
    display: inline-block; margin-bottom: 10px;
    font-size: 9px; color: var(--accent); letter-spacing: 0.14em;
  }

  /* ABOUT */
  #about {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 80px; border-bottom: 1px solid var(--border);
  }
  .about-text p { font-size: 12px; color: #444; line-height: 1.95; margin-bottom: 18px; }
  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
  .sg-title {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .sg-list { list-style: none; }
  .sg-list li {
    font-size: 11px; color: var(--mid); padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .sg-list li::before { content: '—'; color: var(--accent); font-size: 10px; }

  /* EXPERIENCE */
  #experience { border-bottom: 1px solid var(--border); }
  .timeline { display: flex; flex-direction: column; }
  .tl-item {
    display: grid; grid-template-columns: 220px 1fr;
    gap: 48px; padding: 40px 0;
    border-bottom: 1px solid var(--border);
  }
  .tl-item:last-child { border-bottom: none; }
  .tl-period { font-size: 10px; color: var(--accent); letter-spacing: 0.12em; margin-bottom: 6px; }
  .tl-org {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px; color: var(--ink);
  }
  .tl-loc { font-size: 10px; color: var(--mid); margin-top: 3px; }
  .tl-role {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 400; margin-bottom: 10px;
  }
  .tl-badge {
    display: inline-block; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent);
    border: 1px solid rgba(181,129,58,0.35);
    padding: 3px 9px; margin-bottom: 14px;
  }
  .tl-desc { font-size: 11.5px; color: #4a4a4a; line-height: 1.9; }
  .tl-proj-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mid); margin-bottom: 8px; margin-top: 16px; }
  .tl-proj-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tl-proj-tag { font-size: 9.5px; background: var(--warm); padding: 4px 12px; color: var(--ink); letter-spacing: 0.06em; }

  /* EDUCATION */
  #education { border-bottom: 1px solid var(--border); }
  .edu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); }
  .edu-card {
    background: var(--paper); padding: 36px 30px;
    transition: background 0.25s;
  }
  .edu-card:hover { background: var(--warm); }
  .edu-degree {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 400; line-height: 1.25; margin-bottom: 10px;
  }
  .edu-uni { font-size: 11px; color: var(--ink); margin-bottom: 4px; }
  .edu-year { font-size: 10px; color: var(--accent); letter-spacing: 0.12em; margin-bottom: 12px; }
  .edu-gpa { font-size: 10px; color: var(--mid); margin-bottom: 12px; }
  .edu-highlight {
    font-size: 10.5px; color: #555; line-height: 1.8;
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px;
  }

  /* LEADERSHIP */
  #leadership { border-bottom: 1px solid var(--border); }
  .lead-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
  .lead-card { background: var(--paper); padding: 36px 32px; }
  .lead-org { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .lead-role {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 400; margin-bottom: 6px;
  }
  .lead-period { font-size: 10px; color: var(--mid); margin-bottom: 14px; }
  .lead-desc { font-size: 11px; color: #555; line-height: 1.85; }

  /* AWARDS */
  .awards-strip { display: grid; grid-template-columns: repeat(3,1fr); border-bottom: 1px solid var(--border); }
  .award-card {
    padding: 44px 52px; border-right: 1px solid var(--border);
    background: var(--dark);
  }
  .award-card.light { background: var(--paper); }
  .award-card:last-child { border-right: none; }
  .award-icon { font-size: 28px; margin-bottom: 18px; }
  .award-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 300; color: #fff; margin-bottom: 10px;
  }
  .award-card.light .award-title { color: var(--ink); }
  .award-body { font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.85; }
  .award-card.light .award-body { color: #555; }
  .award-year { font-size: 9px; color: var(--accent); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 14px; }

  /* CONTACT */
  #contact { padding: 88px 52px; }
  .contact-links { display: flex; flex-direction: column; }
  .contact-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 1px solid var(--border);
    text-decoration: none; color: var(--ink);
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    transition: color 0.2s;
  }
  .contact-link:first-child { border-top: 1px solid var(--border); }
  .contact-link:hover { color: var(--accent); }
  .contact-link .arrow { transition: transform 0.2s; }
  .contact-link:hover .arrow { transform: translate(4px, -4px); }

  /* FOOTER */
  footer {
    padding: 24px 52px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border);
    font-size: 9.5px; color: var(--mid); letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* Animations */
  .fade { opacity: 0; transform: translateY(24px); transition: opacity 0.65s ease, transform 0.65s ease; }
  .fade.in { opacity: 1; transform: none; }

  @media (max-width: 960px) {
    nav { padding: 18px 24px; }
    .nav-links, .nav-badge { display: none; }
    #hero { grid-template-columns: 1fr; }
    .hero-left { padding: 120px 24px 48px; }
    .hero-right { display: none; }
    section { padding: 64px 24px; }
    .stats-bar { grid-template-columns: 1fr 1fr; }
    .stat { padding: 24px; }
    .projects-grid { grid-template-columns: 1fr; }
    #about { grid-template-columns: 1fr; gap: 40px; padding: 64px 24px; }
    .skills-grid { grid-template-columns: 1fr 1fr; }
    .tl-item { grid-template-columns: 1fr; gap: 8px; }
    .edu-grid { grid-template-columns: 1fr; }
    .lead-grid { grid-template-columns: 1fr; }
    .awards-strip { grid-template-columns: 1fr; }
    .award-card { border-right: none; border-bottom: 1px solid var(--border); }
    footer { flex-direction: column; gap: 6px; text-align: center; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<nav id="nav">
  <a class="nav-logo" href="#" id="nav-logo-text">Loading…</a>
  <ul class="nav-links">
    <li><a href="#projects">Projects</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#education">Education</a></li>
    <li><a href="#contact">Contact</a></li>
    <li><a href="page-istructe.html">IStructE</a></li>
  </ul>
  <span class="nav-badge" id="nav-badge"></span>
</nav>

<section id="hero">
  <div class="hero-left" id="hero-left"></div>
  <div class="hero-right" id="hero-right"></div>
</section>

<div class="stats-bar" id="stats-bar"></div>

<section id="projects">
  <div class="sec-header">
    <span class="sec-n">01</span>
    <h2 class="sec-title">Selected Projects</h2>
    <div class="sec-rule"></div>
  </div>
  <div class="projects-grid" id="projects-grid"></div>
</section>

<section id="about" style="display:grid;grid-template-columns:1fr 1fr;gap:80px;border-bottom:1px solid var(--border);">
  <div>
    <div class="sec-header">
      <span class="sec-n">02</span>
      <h2 class="sec-title">About</h2>
      <div class="sec-rule"></div>
    </div>
    <div class="about-text fade" id="about-text"></div>
  </div>
  <div class="fade" style="transition-delay:.15s">
    <div class="sec-header" style="margin-top:0;">
      <span class="sec-n">&nbsp;</span>
      <h2 class="sec-title" style="font-size:22px;">Technical Skills</h2>
      <div class="sec-rule"></div>
    </div>
    <div class="skills-grid" id="skills-grid"></div>
  </div>
</section>

<section id="experience">
  <div class="sec-header">
    <span class="sec-n">03</span>
    <h2 class="sec-title">Experience</h2>
    <div class="sec-rule"></div>
  </div>
  <div class="timeline" id="timeline"></div>
</section>

<section id="education">
  <div class="sec-header">
    <span class="sec-n">04</span>
    <h2 class="sec-title">Education</h2>
    <div class="sec-rule"></div>
  </div>
  <div class="edu-grid" id="edu-grid"></div>
</section>

<section id="leadership">
  <div class="sec-header">
    <span class="sec-n">05</span>
    <h2 class="sec-title">Leadership & Volunteering</h2>
    <div class="sec-rule"></div>
  </div>
  <div class="lead-grid" id="lead-grid"></div>
</section>

<div class="awards-strip" id="awards-strip"></div>

<section id="contact">
  <div class="fade" style="transition-delay:.15s">
    <div class="contact-links" id="contact-links"></div>
  </div>
</section>

<footer id="site-footer"></footer>

<script>
(function() {
  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  fetch('site-data.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('Could not load site-data.json'); return r.json(); })
    .then(d => {
      renderMeta(d.meta);
      renderHero(d.hero);
      renderStats(d.stats);
      renderProjects(d.projects);
      renderAbout(d.about);
      renderExperience(d.experience);
      renderEducation(d.education);
      renderLeadership(d.leadership);
      renderAwards(d.awards);
      renderContact(d.contact);
      renderFooter(d.meta);
      initInteractions();
    })
    .catch(err => {
      document.body.innerHTML = '<p style="padding:48px;font-family:monospace;color:#c0392b;">Error loading site-data.json: ' + err.message + '</p>';
    });

  function renderMeta(m) {
    document.title = m.title;
    const logo = document.getElementById('nav-logo-text');
    const parts = m.name.split(' ');
    logo.innerHTML = parts[0] + ' <span>' + parts.slice(1).join(' ') + '</span>';
    document.getElementById('nav-badge').textContent = m.navBadge;
  }

  function renderHero(h) {
    // Left panel
    document.getElementById('hero-left').innerHTML = `
      <p class="hero-eyebrow">${esc(h.eyebrow)}</p>
      <h1 class="hero-name">${esc(h.firstName)}<em>${esc(h.lastName)}</em></h1>
      <p class="hero-desc">${esc(h.desc)}</p>
      <div class="hero-cta">
        <a href="${esc(h.ctaPrimary.href)}" class="btn btn-solid">${esc(h.ctaPrimary.label)}</a>
        <a href="${esc(h.ctaSecondary.href)}" class="btn btn-outline">${esc(h.ctaSecondary.label)}</a>
      </div>`;

    // Right panel
    const creds = (h.credentials||[]).map(c => `
      <div class="cred-item">
        <span class="cred-num">${esc(c.num)}</span>
        <div><p class="cred-title">${esc(c.title)}</p><p class="cred-sub">${esc(c.sub)}</p></div>
      </div>`).join('');

    const awards = (h.awards||[]).map((a,i) => `
      <div class="hero-award"${i>0?' style="margin-top:12px;"':''}>
        <p class="award-label">${esc(a.label)}</p>
        <p class="award-text">${esc(a.text)}</p>
      </div>`).join('');

    const photoHtml = h.photo ? `
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,0.07);">
        <div style="width:72px;height:72px;border-radius:50%;border:2px solid rgba(181,129,58,0.5);overflow:hidden;flex-shrink:0;background:#2a2620;display:flex;align-items:center;justify-content:center;">
          <img src="${esc(h.photo)}" alt="${esc(h.firstName+' '+h.lastName)}"
            onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\\'font-family:Cormorant Garamond,serif;font-size:26px;font-weight:300;color:rgba(181,129,58,0.8);\\'>AT</span>'"
            style="width:100%;height:100%;object-fit:cover;object-position:top;">
        </div>
        <div>
          <p style="font-family:Cormorant Garamond,serif;font-size:17px;font-weight:300;color:rgba(255,255,255,0.88);letter-spacing:0.04em;">${esc(h.firstName+' '+h.lastName)}</p>
          <p style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(181,129,58,0.8);margin-top:4px;">GIStructE</p>
        </div>
      </div>` : '';

    document.getElementById('hero-right').innerHTML = photoHtml +
      `<div class="credentials-list">${creds}</div>${awards}`;
  }

  function renderStats(stats) {
    document.getElementById('stats-bar').innerHTML = (stats||[]).map((s,i) =>
      `<div class="stat fade" style="${i>0?'transition-delay:'+(i*0.08)+'s':''}">
        <div class="stat-n">${esc(s.n)}</div>
        <div class="stat-l">${esc(s.label)}</div>
      </div>`
    ).join('');
  }

  function renderProjects(projects) {
    const grid = document.getElementById('projects-grid');
    const active = (projects||[]).filter(p => p.active).slice(0,9);
    if (!active.length) { grid.innerHTML = '<p style="padding:48px;color:var(--mid);font-size:11px;">No projects to display.</p>'; return; }
    const delays = [0,0.08,0.16,0,0.08,0.16,0,0.08,0.16];
    grid.innerHTML = active.map((p,i) => {
      const tags = (p.tags||[]).map(t => `<span class="ptag">${esc(t)}</span>`).join('');
      const valueHtml = p.value ? `<span class="proj-value">${esc(p.value)}</span>` : '';
      const imgHtml = p.image
        ? `<div style="width:100%;aspect-ratio:1/1;overflow:hidden;margin:-36px -32px 22px;"><img src="${esc(p.image)}" alt="${esc(p.imageAlt)}" onerror="this.parentElement.style.display='none'" style="width:100%;height:100%;object-fit:cover;display:block;"></div>`
        : '';
      return `<div class="proj fade" onclick="location.href='${esc(p.url)}'" style="cursor:pointer;${delays[i]?'transition-delay:'+delays[i]+'s':''}">
        ${imgHtml}<span class="proj-sector">${esc(p.sector)}</span>${valueHtml}
        <h3 class="proj-name">${esc(p.name)}</h3>
        <p class="proj-meta">${esc(p.meta)}</p>
        <p class="proj-desc">${esc(p.desc)}</p>
        <div class="proj-tags">${tags}</div>
        <span class="proj-arrow">↗</span>
      </div>`;
    }).join('');
  }

  function renderAbout(a) {
    const photoHtml = a.photo ? `
      <div style="margin-bottom:28px;overflow:hidden;">
        <img src="${esc(a.photo)}" alt="Photo"
          onerror="this.style.display='none'"
          style="width:50%;height:auto;display:block;">
      </div>` : '';
    document.getElementById('about-text').innerHTML =
      photoHtml + (a.paragraphs||[]).map(p => `<p>${esc(p)}</p>`).join('');

    document.getElementById('skills-grid').innerHTML = (a.skills||[]).map(sg => `
      <div class="skill-group">
        <p class="sg-title">${esc(sg.group)}</p>
        <ul class="sg-list">${(sg.items||[]).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      </div>`).join('');
  }

  function renderExperience(exp) {
    document.getElementById('timeline').innerHTML = (exp||[]).map((e,i) => {
      const projs = e.projects && e.projects.length
        ? `<p class="tl-proj-label">Key Projects</p>
           <div class="tl-proj-list">${e.projects.map(p => `<span class="tl-proj-tag">${esc(p)}</span>`).join('')}</div>`
        : '';
      return `<div class="tl-item fade" style="${i>0?'transition-delay:'+(i*0.1)+'s':''}">
        <div>
          <p class="tl-period">${esc(e.period)}</p>
          <p class="tl-org">${esc(e.org)}</p>
          <p class="tl-loc">${esc(e.location)}</p>
        </div>
        <div>
          <h3 class="tl-role">${esc(e.role)}</h3>
          <span class="tl-badge">${esc(e.badge)}</span>
          <p class="tl-desc">${esc(e.desc)}</p>
          ${projs}
        </div>
      </div>`;
    }).join('');
  }

  function renderEducation(edu) {
    document.getElementById('edu-grid').innerHTML = (edu||[]).map((e,i) => `
      <div class="edu-card fade" style="${i>0?'transition-delay:'+(i*0.1)+'s':''}">
        <h3 class="edu-degree">${esc(e.degree)}</h3>
        <p class="edu-uni">${esc(e.uni)}</p>
        <p class="edu-year">${esc(e.year)}</p>
        <p class="edu-gpa">${esc(e.gpa)}</p>
        <p class="edu-highlight">${esc(e.highlight)}</p>
      </div>`).join('');
  }

  function renderLeadership(lead) {
    document.getElementById('lead-grid').innerHTML = (lead||[]).map((l,i) => `
      <div class="lead-card fade" style="${i%2!==0?'transition-delay:0.1s':''}">
        <p class="lead-org">${esc(l.org)}</p>
        <h3 class="lead-role">${esc(l.role)}</h3>
        <p class="lead-period">${esc(l.period)}</p>
        <p class="lead-desc">${esc(l.desc)}</p>
      </div>`).join('');
  }

  function renderAwards(awards) {
    document.getElementById('awards-strip').innerHTML = (awards||[]).map((a,i) => {
      const isDark = a.dark !== false && i === 0; // first is dark by default, unless explicitly false
      const dark = a.dark;
      const photoHtml = a.photo
        ? `<div style="margin-bottom:18px;overflow:hidden;">
             <img src="${esc(a.photo)}" alt="${esc(a.title)}" onerror="this.style.display='none'" style="width:100%;height:auto;display:block;${dark?'opacity:0.9':''}">
           </div>` : '';
      return `<div class="award-card fade ${dark?'':'light'}" style="${i>0?'transition-delay:'+(i*0.1)+'s':''}">
        <div class="award-icon" style="${!dark?'color:var(--accent)':''}">${esc(a.icon)}</div>
        ${photoHtml}
        <h3 class="award-title">${esc(a.title)}</h3>
        <p class="award-body">${esc(a.body)}</p>
        <p class="award-year">${esc(a.year)}</p>
      </div>`;
    }).join('');
  }

  function renderContact(c) {
    document.getElementById('contact-links').innerHTML = (c.links||[]).map(l => {
      const dl = l.download ? ` download="${esc(l.download)}"` : '';
      return `<a href="${esc(l.href)}" class="contact-link"${dl}${l.href.startsWith('http')?' target="_blank"':''}>
        ${esc(l.label)} <span class="arrow">${esc(l.arrow)}</span>
      </a>`;
    }).join('');
  }

  function renderFooter(m) {
    document.getElementById('site-footer').innerHTML =
      `<span>${esc(m.footerLeft)}</span><span>${esc(m.footerMid)}</span><span>${esc(m.footerRight)}</span>`;
  }

  function initInteractions() {
    const c = document.getElementById('cursor');
    document.addEventListener('mousemove', e => { c.style.left = e.clientX+'px'; c.style.top = e.clientY+'px'; });
    document.querySelectorAll('a,button,.proj,.stat,.edu-card,.lead-card,.award-card').forEach(el => {
      el.addEventListener('mouseenter', () => c.classList.add('big'));
      el.addEventListener('mouseleave', () => c.classList.remove('big'));
    });
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => { nav.classList.toggle('scrolled', window.scrollY > 40); });
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }),
      { threshold: 0.08, rootMargin: '0px 0px -20px 0px' }
    );
    document.querySelectorAll('.fade').forEach(el => {
      obs.observe(el);
      if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('in');
    });
  }
})();
</script>
</body>
</html>
